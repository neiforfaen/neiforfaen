name: Update README
on:
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run update script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: bun run ./scripts/readme/update-readme.ts

      - run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@neiforfaen.github.io"
          git config --global user.name "neiforfaen/gh-actions-bot"
          git commit -m "docs(README): updated github stats" -a || echo "Nothing to commit"
          git push
